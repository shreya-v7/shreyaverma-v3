[build]
  # Use npm so Netlify works with package-lock.json without a pnpm store.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public newsletter address, not a credential. Keep all other secret scanning enabled.
  SECRETS_SCAN_OMIT_KEYS = "SUBSTACK_PUBLICATION_URL"
  # Set in Netlify UI (Site settings → Environment variables), never commit:
  # SPOTIFY_PLAYLIST_IDS, SPOTIFY_TOP_ARTIST_IDS, SPOTIFY_FAVORITE_TRACK_ID
  # SUBSTACK_PUBLICATION_URL (@handle, publication slug, or full URL)
  # Optional: VITE_SPOTIFY_API_PROXY_TARGET (local proxy)

[functions]
  directory = "netlify/functions"

[dev]
  command = "npx vite --port 5173"
  framework = "#custom"
  targetPort = 5173
  port = 8888
  autoLaunch = false
  envFiles = [".env"]

[[redirects]]
  from = "/api/spotify-playlist"
  to = "/.netlify/functions/spotify-playlist"
  status = 200
  force = true

[[redirects]]
  from = "/api/substack-posts"
  to = "/.netlify/functions/substack-posts"
  status = 200
  force = true

[[redirects]]
  from = "/about/certifications"
  to = "/about/honors"
  status = 301

[[redirects]]
  from = "/about/achievements"
  to = "/about/honors"
  status = 301

[[redirects]]
  from = "/diary/movies"
  to = "/diary/cinema"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
